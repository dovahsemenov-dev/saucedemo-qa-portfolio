[pytest]
testpaths = automation/tests
# automation/ в sys.path, чтобы conftest и тесты писали `from config import ...`
pythonpath = automation
addopts = -ra --html=report.html --self-contained-html
markers =
    smoke: критичные позитивные сценарии, обязательные к прохождению
    regression: полный регрессионный набор
