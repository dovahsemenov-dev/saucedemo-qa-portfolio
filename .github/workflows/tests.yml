name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run UI tests
        run: pytest -m ui --reruns 2 --reruns-delay 3 --html=report-ui.html --self-contained-html
        env:
          HEADLESS: '1'
          UI_TIMEOUT: '30'

      - name: Upload UI HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-report
          path: report-ui.html

  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API tests
        run: pytest -m api --html=report-api.html --self-contained-html

      - name: Upload API HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report
          path: report-api.html

      # Коллекция прогоняется отдельно; падения шагов 8 и 9 — известные дефекты
      # BUG-06 и BUG-07, поэтому job не считается упавшим (continue-on-error).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Postman collection with Newman
        continue-on-error: true
        run: >
          npx --yes newman run
          api/restful_booker.postman_collection.json
          -e api/restful_booker.postman_environment.json
